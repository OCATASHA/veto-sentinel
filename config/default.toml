# Veto Sentinel configuration.
#
# ALL NUMERIC DEFAULTS ARE UNVALIDATED STARTING PARAMETERS chosen to be conservative for a
# demonstration. They are not statistically optimised. Do not tune them on the same event
# periods you use to report performance.

parameter_status = "unvalidated starting parameters"

[panic]
backend = "auto"                 # auto | finbert | lexicon (lexicon = labelled fallback heuristic)
model_name = "ProsusAI/finbert"
window_minutes = 60
min_headlines = 3

[drift]
backend = "auto"                 # auto | minilm | hashing (hashing = labelled fallback heuristic)
model_name = "sentence-transformers/all-MiniLM-L6-v2"
recent_window_minutes = 60
reference_window_days = 7
min_recent = 5
min_reference = 50
bias_correction = true

[intensity]
interval_minutes = 60
lookback_days = 28
min_history_days = 3
baseline_timezone = "UTC"        # e.g. "America/New_York" to follow US market hours across DST
split_weekends = true
poisson_floor = true

[normalizer]
method = "robust"                # robust (median/MAD) | standard (mean/std)
baseline_days = 7
baseline_gap_minutes = 60
min_baseline_samples = 48
z_clip = 10.0
z_floor = 0.0                    # 0 => calm readings cannot offset stressed ones
min_scale = { panic = 0.02, drift = 0.01, volume = 0.15 }

[composite]
weights = { panic = 0.4, drift = 0.3, volume = 0.3 }
required_for_ready = ["volume"]

[cusum]
k = 1.0
h = 6.0
alarm_hold_minutes = 60

[state_machine]
caution_enter = 2.0
caution_exit = 1.0
halt_enter = 3.5
halt_exit = 2.5
cooldown_minutes = 30
degraded_floor = "CAUTION"
changepoint_escalates = true

[bus]
pub_endpoint = "tcp://*:5556"
topic = "vs.v1"
heartbeat_interval_ms = 1000
heartbeat_timeout_ms = 3000
pipeline_stale_ms = 30000
top_headlines = 5
allow_fault_injection = true     # demo-only endpoints; set false outside demos

[service]
tick_seconds = 60
db_path = "data/vetosentinel.duckdb"
model_cache_path = "data/model_cache.sqlite"   # FinBERT/MiniLM results, reused across runs
dashboard_host = "127.0.0.1"
dashboard_port = 8000

[replay]
tick_minutes = 5
speed = 3600                     # simulated seconds per wall second
fast_forward_days = 0

[ingest]
default_source_weight = 1.0
dedup_ttl_days = 7
future_skew_seconds = 300
stale_after_seconds = 900
max_data_lag_minutes = 120     # live: assess news as of when it's complete; not ready if further behind
languages = ["en", "und"]
source_weights = { "federal reserve" = 1.5, "ecb" = 1.5, "bank of england" = 1.5 }

# Live adapters (used by `vetosentinel live` and `vetosentinel probe-adapters`).
# Availability and terms of use are the providers'. Verify before relying on them.
# GDELT via its 15-minute raw files: no query rate limits. On start it loads the last
# `backfill_days` from the archive (hourly, cached in cache_dir) so the monitor is ready at once.
# 15 days covers three previous weekends, which weekend baselines need. First start downloads
# ~1-2 GB (a few minutes); later starts only fetch what's new.
[[ingest.adapters]]
kind = "gdelt_gkg"
name = "gdelt"
poll_seconds = 120
backfill_days = 15
cache_dir = "data/gdelt_cache"

# GDELT DOC search API: disabled. It refused our multi-term query with HTTP 429 on every probe
# from the development machine (2026-10-24), even with long waits between calls.
[[ingest.adapters]]
kind = "gdelt"
name = "gdelt-doc-api"
enabled = false
poll_seconds = 300

# Note: /feeds/press_all.xml is listed on federalreserve.gov/feeds but returned HTTP 404 when
# probed on 2026-10-24; the monetary-policy and banking-regulation feeds returned 200.
[[ingest.adapters]]
kind = "rss"
name = "fed-monetary"
source = "Federal Reserve"
url = "https://www.federalreserve.gov/feeds/press_monetary.xml"
poll_seconds = 600

[[ingest.adapters]]
kind = "rss"
name = "fed-bcreg"
source = "Federal Reserve"
url = "https://www.federalreserve.gov/feeds/press_bcreg.xml"
poll_seconds = 600

[[ingest.adapters]]
kind = "rss"
name = "ecb"
source = "ECB"
url = "https://www.ecb.europa.eu/rss/press.html"
poll_seconds = 600

[[ingest.adapters]]
kind = "rss"
name = "boe"
source = "Bank of England"
url = "https://www.bankofengland.co.uk/rss/news"
poll_seconds = 600

[[ingest.adapters]]
kind = "newsapi"                 # only active if VETOSENTINEL_NEWSAPI_KEY is set
name = "newsapi"
api_key_env = "VETOSENTINEL_NEWSAPI_KEY"
poll_seconds = 900
params = { category = "business", language = "en", pageSize = "100" }
